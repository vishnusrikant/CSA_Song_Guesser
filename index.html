<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Songdle</title>

  <!--
    CACHE-BUSTING
    =============
    Browsers cache styles.css / script.js aggressively, so visitors with
    an old copy keep seeing the old design even after we ship new code.

    The `?v=N` query string at the end of each link is the fix: when the
    number changes, the browser sees a brand-new URL and re-downloads the
    file. The file on the server is identical - only the URL changes.

    HOW TO USE: every time you change styles.css or script.js, bump the
    `?v=` number in BOTH lines below (e.g. v=2 -> v=3 -> v=4). No other
    change is required to invalidate every visitor's cache.
  -->
  <link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>
  <!--
    PAGE LAYOUT (matches the hand-drawn template)
    =============================================
      1. Title    - "Songdle" centered above the guess input (green text).
      2. Counter  - "Guess X of N" right under the title.
      3. Input    - text box where the player types a guess.
      4. Board    - stack of past-guess cards. Each card shows the guessed
                    song (avatar + name) on top and a 3-column x 2-row grid
                    of attribute clue tiles below:
                        Album   | Genre             | Year
                        Artist  | Billboard Top 100 | Length
                    Song Pic and Song Name are intentionally NOT shown as
                    clue tiles because they already appear at the top of
                    each guess card.
      5. Hints    - Chorus Song Lyric + 5-sec Song Clip, locked until the
                    player has used 5 guesses.
      6. Legend   - reminder of what the three tile colors mean.
  -->
  <main class="container">

    <!-- 1 & 2. HEADER: centered title + counter, above the input. -->
    <header class="header">
      <h1 class="title">Songdle</h1>
      <p class="counter">
        Guess <span id="guess-number">1</span> of <span id="max-guesses">10</span>
      </p>
    </header>

    <!-- 3. GUESS INPUT + autocomplete dropdown -->
    <!-- .search-wrap is position:relative so the dropdown can sit under it. -->
    <div class="search-wrap">
      <form id="guess-form" class="guess-form" autocomplete="off">
        <input
          id="guess-input"
          class="guess-input"
          type="text"
          placeholder="Type a guess here..."
          aria-label="Song guess"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="suggestions"
        />
        <button class="btn-search" type="submit" aria-label="Submit guess">
          &#x1F50D;
        </button>
      </form>

      <!-- script.js fills this with matching songs (top 5 visible, scrollable). -->
      <ul id="suggestions" class="suggestions" role="listbox"></ul>
    </div>

    <!-- Status / win / lose messages. -->
    <p id="message" class="message" aria-live="polite"></p>

    <!-- 4. BOARD: script.js prepends a <article class="guess-card"> per guess. -->
    <section id="board" class="board" aria-live="polite"></section>

    <!-- 5. HINTS PANEL: unlocked once 5 guesses are used. -->
    <section class="hints">
      <h2 class="hints-title">Tap the hint you want!</h2>
      <p class="hints-subtitle">Hints unlock after 5 wrong guesses.</p>
      <div class="hints-buttons">
        <button id="hint-lyric" class="hint-btn locked" type="button" disabled>
          Chorus Song Lyric
        </button>
        <button id="hint-clip" class="hint-btn locked" type="button" disabled>
          5-sec Song Clip
        </button>
      </div>
      <div id="hint-display" class="hint-display"></div>
    </section>

    <!-- 6. LEGEND -->
    <section class="legend">
      <span class="legend-item legend-none">No Match</span>
      <span class="legend-item legend-close">Close</span>
      <span class="legend-item legend-match">Match</span>
    </section>

    <p class="footer-note">
      Use the matching attributes to make more guesses. Good luck!
    </p>
  </main>

  <!-- See CACHE-BUSTING note in <head>: bump ?v=N together with styles.css. -->
  <script src="script.js?v=6"></script>
</body>
</html>
