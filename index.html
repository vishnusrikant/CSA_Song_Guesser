<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Songdle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1 class="title">Songdle</h1>
    <p class="tagline">Guess the song of the day!</p>

    <section id="game" class="game">
      <div id="clue" class="clue">Press Start to begin.</div>

      <form id="guess-form" class="guess-form" autocomplete="off">
        <input
          id="guess-input"
          class="guess-input"
          type="text"
          placeholder="Type your guess..."
          disabled
        />
        <button id="guess-button" class="btn" type="submit" disabled>Guess</button>
      </form>

      <button id="start-button" class="btn btn-primary" type="button">Start</button>

      <div id="result" class="result" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
